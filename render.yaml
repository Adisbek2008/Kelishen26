# Render Blueprint: free Kelishen web service (https://render.com)
# Note: the free plan has an ephemeral disk — the database resets to demo data
# on every deploy and after the service sleeps (15 minutes without requests).
services:
  - type: web
    name: safedeal
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: SAFEDEAL_MASTER_KEY
        generateValue: true      # random 256-bit key for encrypting PII and files
      - key: ADMIN_PASSWORD
        sync: false              # Render asks on creation; empty = random (see the logs)
      - key: KYC_AUTO_APPROVE
        value: "1"               # demo: verification is approved immediately
      - key: TRUST_PROXY
        value: "1"               # one Render proxy in front of the app — correct client IPs for rate limiting
